services:
  - type: web
    name: suedue-verifier
    runtime: python
    rootDir: python-verifier
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FAMPAY_GMAIL
        sync: false
      - key: FAMPAY_GMAIL_APP_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: VERIFIER_SHARED_SECRET
        sync: false
